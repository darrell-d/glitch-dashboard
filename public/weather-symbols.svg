<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="sun-fill" x2="0.6" y2="1"><stop stop-color="#ffe4a3"/><stop offset="1" stop-color="#eab655"/></linearGradient>
    <linearGradient id="cloud-fill" x2="0" y2="1"><stop stop-color="#e3eee9"/><stop offset="1" stop-color="#8aa8a1"/></linearGradient>
    <linearGradient id="moon-fill" x2="0.6" y2="1"><stop stop-color="#edf4df"/><stop offset="1" stop-color="#9dbcb7"/></linearGradient>
    <g id="sun-shape"><circle cx="100" cy="100" r="38" fill="url(#sun-fill)"/><g stroke="#f4ce7a" stroke-width="5" stroke-linecap="round"><path d="M100 30v10m0 120v10M30 100h10m120 0h10M50 50l8 8m84 84 8 8M50 150l8-8m84-84 8-8"/></g></g>
    <g id="moon-shape"><path d="M130 38a66 66 0 1 0 34 105A61 61 0 0 1 130 38Z" fill="url(#moon-fill)"/><g fill="#d5e8d3"><path d="m160 33 3 9 9 3-9 3-3 9-3-9-9-3 9-3Z"/><circle cx="172" cy="82" r="2.5"/></g></g>
    <g id="cloud-shape"><path d="M53 140a31 31 0 0 1-4-62 48 48 0 0 1 91-11 37 37 0 1 1 6 73Z" fill="url(#cloud-fill)"/></g>
    <g id="rain-shape" stroke="#86c8db" stroke-width="6" stroke-linecap="round"><path d="m65 153-7 16m44-16-7 16m44-16-7 16"/></g>
    <g id="snowflake" stroke="#cce9eb" stroke-width="3" stroke-linecap="round"><path d="M0-9V9m-8-14 16 10M-8 5 8-5"/></g>
  </defs>
  <symbol id="sun" viewBox="0 0 200 200"><use xlink:href="#sun-shape"/></symbol>
  <symbol id="moon" viewBox="0 0 200 200"><use xlink:href="#moon-shape"/></symbol>
  <symbol id="partly-day" viewBox="0 0 200 200"><use xlink:href="#sun-shape" transform="translate(46 -15) scale(.75)"/><use xlink:href="#cloud-shape" transform="translate(-8 21) scale(.95)"/></symbol>
  <symbol id="partly-night" viewBox="0 0 200 200"><use xlink:href="#moon-shape" transform="translate(54 -14) scale(.72)"/><use xlink:href="#cloud-shape" transform="translate(-8 21) scale(.95)"/></symbol>
  <symbol id="cloud" viewBox="0 0 200 200"><use xlink:href="#cloud-shape"/></symbol>
  <symbol id="rain" viewBox="0 0 200 200"><use xlink:href="#cloud-shape" transform="translate(0 -17)"/><use xlink:href="#rain-shape" transform="translate(0 -10)"/></symbol>
  <symbol id="snow" viewBox="0 0 200 200"><use xlink:href="#cloud-shape" transform="translate(0 -17)"/><use xlink:href="#snowflake" transform="translate(59 151)"/><use xlink:href="#snowflake" transform="translate(103 162)"/><use xlink:href="#snowflake" transform="translate(147 151)"/></symbol>
  <symbol id="fog" viewBox="0 0 200 200"><use xlink:href="#cloud-shape" transform="translate(0 -24)"/><g stroke="#adc7c1" stroke-width="5" stroke-linecap="round"><path d="M38 135h103m-82 17h109m-126 17h77"/></g></symbol>
  <symbol id="storm" viewBox="0 0 200 200"><use xlink:href="#cloud-shape" transform="translate(0 -21)"/><path d="m105 115-22 39h23l-11 32 38-49h-25l18-22Z" fill="#f1cf78"/></symbol>
  <symbol id="unknown" viewBox="0 0 200 200"><circle cx="100" cy="100" r="50" fill="none" stroke="#9da99d" stroke-width="4" stroke-dasharray="6 10"/><path d="M88 86c0-17 27-18 27 0 0 12-15 12-15 24m0 16v1" stroke="#bdc9bf" fill="none" stroke-width="5" stroke-linecap="round"/></symbol>
