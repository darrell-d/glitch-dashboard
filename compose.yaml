services:
  dashboard:
    build: .
    ports:
      - "8080:8080"
    environment:
      WEATHER_LOCATION: ${WEATHER_LOCATION:-Philadelphia}
      WEATHER_LATITUDE: ${WEATHER_LATITUDE:-39.9526}
      WEATHER_LONGITUDE: ${WEATHER_LONGITUDE:--75.1652}
      DASHBOARD_TIMEZONE: ${DASHBOARD_TIMEZONE:-America/New_York}
